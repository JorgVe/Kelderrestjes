<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kelderrestjes — menu</title>
<meta name="description" content="Het menu van de huisbar: van frisdrank en bier tot whisky, plus mocktails en cocktails.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,700;1,6..96,400&family=Karla:wght@400;500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --shelf:#7E9280;
    --shelf-deep:#5D6E60;
    --ink:#1E2721;
    --paper:#EDEFE7;
    --paper-2:#E2E6D9;
    --brass:#C69A3E;
    --amber:#B4622B;
    --line:rgba(30,39,33,.18);
    --bar:10px;                      /* alles wat bovenaan blijft staan bij het scrollen: de gele rand (10px) en, als die er is, de mededeling; zet boot.js */
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Karla',system-ui,sans-serif;
    font-size:16px;
    line-height:1.55;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:1120px;margin:0 auto;padding:0 24px}

  /* ---------- hero: the shelf ---------- */
  header.shelf{
    background:var(--shelf-deep);
    padding:56px 0 0;
    position:relative;
    overflow:hidden;
  }
  /* de gele rand onder de kop blijft bovenaan staan als je scrolt; de andere plakkende balken beginnen eronder (op --bar) */
  .brassbar{height:10px;background:var(--brass);position:sticky;top:0;z-index:40}
  .eyebrow{
    font-family:'Space Mono',monospace;
    font-size:11px;letter-spacing:.22em;text-transform:uppercase;
    color:rgba(255,255,255,.9);
  }
  h1{
    font-family:'Bodoni Moda',serif;
    font-weight:700;
    font-size:clamp(44px,9vw,104px);
    line-height:.92;
    letter-spacing:-.02em;
    color:#fff;
    margin:10px 0 14px;
  }
  h1 em{font-style:italic;font-weight:400;color:var(--brass)}
  .lede{
    max-width:54ch;color:rgba(255,255,255,.92);font-size:17px;
    padding-bottom:34px;
  }
  .lede .key{background:var(--paper);color:var(--amber);font-weight:700;padding:0 6px}
  .lede a{color:#fff}

  .nav{display:flex;gap:8px;margin-bottom:34px;position:relative;z-index:1}
  .nav a{
    font-family:'Space Mono',monospace;font-size:11px;letter-spacing:.18em;text-transform:uppercase;
    color:#fff;text-decoration:none;padding:7px 14px;
    border:1px solid rgba(255,255,255,.45);border-radius:999px;
  }
  .nav a:hover{border-color:#fff}
  .nav a[aria-current="page"]{background:#fff;color:var(--ink);border-color:#fff}
  .nav a:focus-visible{outline:3px solid var(--brass);outline-offset:2px}

  /* bottle silhouettes row — one per bottle on the shelf */
  .bottles{display:flex;align-items:flex-end;gap:5px;height:74px;position:relative;z-index:1;flex-wrap:nowrap;overflow:hidden}
  .bottles i{
    display:block;flex:1 1 0;max-width:16px;background:rgba(30,39,33,.22);
    border-radius:5px 5px 2px 2px;position:relative;
  }
  .bottles i::before{
    content:"";position:absolute;left:50%;transform:translateX(-50%);
    bottom:100%;width:5px;height:12px;background:inherit;border-radius:2px;
  }

  /* ---------- picker ---------- */
  section{padding:56px 0}
  .sec-head{display:flex;align-items:baseline;gap:16px;flex-wrap:wrap;margin-bottom:8px}
  h2{
    font-family:'Bodoni Moda',serif;font-weight:700;
    font-size:clamp(26px,4vw,40px);letter-spacing:-.01em;
  }
  .sec-note{font-size:15px;color:rgba(30,39,33,.66);max-width:56ch;margin-bottom:26px}

  .group{margin-bottom:16px}
  .glabel{
    display:block;font-family:'Space Mono',monospace;font-size:10px;
    letter-spacing:.18em;text-transform:uppercase;color:rgba(30,39,33,.7);margin-bottom:7px;
  }
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{
    font-family:'Karla',sans-serif;font-size:14px;font-weight:500;
    background:transparent;color:var(--ink);
    border:1px solid var(--line);border-radius:999px;
    padding:7px 14px;cursor:pointer;
    transition:background .15s,color .15s,border-color .15s;
  }
  .chip:hover{border-color:var(--shelf-deep)}
  .chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
  .chip.reset{border-style:dashed;color:rgba(30,39,33,.7)}
  .chip:focus-visible{outline:3px solid var(--brass);outline-offset:2px}
  .count{
    font-family:'Space Mono',monospace;font-size:12px;letter-spacing:.1em;
    text-transform:uppercase;color:rgba(30,39,33,.7);margin-top:14px;display:block;
  }

  /* ---------- cards ---------- */
  .grid{
    display:grid;gap:1px;background:var(--line);
    border:1px solid var(--line);margin-top:22px;
    grid-template-columns:repeat(auto-fill,minmax(min(300px,100%),1fr));
  }
  .card{background:var(--paper);padding:26px 24px 24px;display:flex;flex-direction:column}
  .card[hidden]{display:none}
  .card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
  .card h3{
    font-family:'Bodoni Moda',serif;font-weight:700;font-size:25px;
    line-height:1.1;letter-spacing:-.01em;
  }
  .tags{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
  .tag{
    font-family:'Space Mono',monospace;font-size:10px;letter-spacing:.14em;
    text-transform:uppercase;padding:4px 7px;border:1px solid var(--line);
    white-space:nowrap;color:rgba(30,39,33,.7);
  }
  .tag.ready{border-color:var(--shelf-deep);background:var(--shelf-deep);color:#fff}
  .blurb{font-size:14px;color:rgba(30,39,33,.7);margin:8px 0 16px;font-style:italic}
  ul.spec{list-style:none;font-family:'Space Mono',monospace;font-size:13px;line-height:1.9}
  ul.spec li{display:flex;gap:10px;border-bottom:1px dotted var(--line);padding:1px 0}
  ul.spec li .ml{min-width:52px;color:rgba(30,39,33,.7)}
  .method{font-size:14px;margin-top:14px;color:rgba(30,39,33,.85)}
  .card a.rec{
    margin-top:auto;padding-top:16px;font-family:'Space Mono',monospace;
    font-size:11px;letter-spacing:.12em;text-transform:uppercase;
    color:var(--ink);text-underline-offset:4px;
  }
  .card a.rec:hover{color:var(--amber)}

  .empty{padding:40px 0;font-size:15px;color:rgba(30,39,33,.7)}
  .empty[hidden]{display:none}

  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
  @media (max-width:600px){ .bottles{gap:3px} }

  .nav{flex-wrap:wrap}
  section.alt{background:var(--paper-2)}
  a.chip{display:inline-block;text-decoration:none}
  a.chip:hover{background:var(--ink);color:var(--paper);border-color:var(--ink)}
  .jump{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px}

  /* ---------- menu & lijsten ---------- */
  .sect{margin-top:40px;scroll-margin-top:calc(16px + var(--bar))}
  .sect h3{
    font-family:'Bodoni Moda',serif;font-weight:700;font-size:24px;letter-spacing:-.01em;line-height:1.1;
    padding-bottom:6px;border-bottom:2px solid var(--ink);
    display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;
  }
  ul.menu{list-style:none;display:grid;grid-template-columns:repeat(auto-fill,minmax(min(300px,100%),1fr));column-gap:48px}
  .drink{padding:14px 0;border-bottom:1px dotted var(--line)}
  .d-top{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
  .d-name{font-weight:700;font-size:17px;color:var(--ink);text-decoration:none}
  a.d-name{text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:4px}
  a.d-name:hover{color:var(--amber);text-decoration-color:var(--amber)}
  a.d-name:focus-visible{outline:3px solid var(--brass);outline-offset:2px}
  .d-sub{font-size:14px;color:rgba(30,39,33,.7);font-style:italic;margin-top:2px}
  .d-serve{font-size:14px;color:rgba(30,39,33,.85);margin-top:2px}
  .d-mix{font-family:'Space Mono',monospace;font-size:11px;letter-spacing:.04em;line-height:1.7;color:rgba(30,39,33,.7);margin-top:6px}
  .d-rec{display:inline-block;margin-top:6px;font-family:'Space Mono',monospace;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink);text-underline-offset:4px}
  .d-rec:hover{color:var(--amber)}
  .gone-note{color:var(--amber)}

  /* ---------- niet beschikbaar ---------- */
  .tag.gone{border-color:var(--amber);color:var(--amber)}
  .tag[hidden]{display:none}
  .drink.is-out .d-name,.drink.is-out .d-sub,.drink.is-out .d-serve{opacity:.5}
  .drink.is-out .d-name{text-decoration:line-through}
  .card.out{opacity:.55}
  .card.out h3{text-decoration:line-through}
  .miss{font-family:'Space Mono',monospace;font-size:11px;letter-spacing:.06em;color:var(--amber);margin-top:10px}
  .miss[hidden]{display:none}

  /* ---------- wijnkaarten ---------- */
  dl.facts{font-family:'Space Mono',monospace;font-size:13px;line-height:1.9;margin-top:4px}
  dl.facts div{display:flex;gap:10px;border-bottom:1px dotted var(--line);padding:1px 0}
  dl.facts dt{min-width:72px;color:rgba(30,39,33,.7)}
  dl.facts dd.todo{color:rgba(30,39,33,.4);font-style:italic}
  .sect .grid{margin-top:16px}

  /* ---------- ingrediënten ---------- */
  .panel{background:#fff;border-left:3px solid var(--brass);padding:18px 20px;margin-top:22px}
  .panel h3{font-family:'Bodoni Moda',serif;font-size:20px;margin-bottom:8px}
  .pill{display:inline-block;margin:0 8px 8px 0;padding:5px 12px;border-radius:999px;background:var(--amber);color:#fff;font-size:14px;font-weight:500}
  .none{font-size:14px;color:rgba(30,39,33,.7)}
  .lostlist{list-style:none;font-size:14px}
  .lostlist li{padding:4px 0;border-bottom:1px dotted var(--line)}
  .lostlist span{color:rgba(30,39,33,.7)}
  pre#outcode{font-family:'Space Mono',monospace;font-size:12px;background:var(--paper-2);padding:10px 12px;margin:10px 0;overflow-x:auto;white-space:pre-wrap;word-break:break-word}
  .actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
  .actions .chip[hidden]{display:none}
  #state{font-size:14px;color:rgba(30,39,33,.75);max-width:62ch}

  /* ---------- recept in een venster ---------- */
  .d-mix a.rlink{color:inherit;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
  .d-mix a.rlink:hover{color:var(--amber);text-decoration-color:var(--amber)}
  .d-mix a.rlink:focus-visible{outline:3px solid var(--brass);outline-offset:2px}
  /* margin:auto zet het venster in het midden; de reset bovenaan (margin:0) haalt dat anders weg */
  dialog#recipedlg{margin:auto;border:0;border-top:6px solid var(--brass);padding:0;width:min(520px,calc(100vw - 32px));max-height:calc(100vh - 32px);background:var(--paper);color:var(--ink);box-shadow:0 20px 60px rgba(0,0,0,.35)}
  dialog#recipedlg::backdrop{background:rgba(30,39,33,.55)}
  .rd-body{padding:22px 24px 20px;display:grid;gap:12px}
  .rd-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
  .rd-head h2{font-size:30px;line-height:1.05}
  .rd-body h3{font-family:'Space Mono',monospace;font-size:10px;font-weight:400;letter-spacing:.18em;text-transform:uppercase;color:rgba(30,39,33,.7)}
  .rd-body .blurb{margin:0}
  .rd-body .method{margin-top:0}
  .rd-btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
  .chip.primary{background:var(--ink);color:var(--paper);border-color:var(--ink)}
  a.chip.primary:hover{background:var(--shelf-deep);border-color:var(--shelf-deep)}
  a.chip[hidden]{display:none}

  /* beheerder: de naam van een drank is een knop die het bewerkvenster opent (zie js/item-dialog.js) */
  button.item-edit{font:inherit;font-size:17px;font-weight:700;color:var(--ink);background:none;border:0;padding:0;margin:0;text-align:left;cursor:pointer;text-decoration:underline;text-decoration-style:dotted;text-decoration-color:var(--brass);text-underline-offset:4px}
  button.item-edit:hover{color:var(--amber);text-decoration-color:var(--amber)}
  button.item-edit:focus-visible{outline:3px solid var(--brass);outline-offset:2px}

  /* ---------- categorieën als gekleurde banden over de hele breedte, met een index die meescrolt ----------
     Elke categorie is een band met een eigen tint (van alcoholvrij naar sterk: salie, room, goud, rosé, koper), net als de
     mocktails. De banden lopen tot de randen van het scherm (de schaduw-truc); de inhoud blijft in de kolom.
     Op een breed scherm staat links een index die meeschuift en markeert waar je bent; op een smal scherm doet de zwevende
     chipbalk bovenaan dat. */
  .layout{max-width:1120px;margin:0 auto;padding:0 24px;display:grid;grid-template-columns:168px minmax(0,1fr);column-gap:36px}
  .stack{min-width:0}
  .stack .wrap{max-width:none;padding:0}
  .stack section{position:relative;padding:46px 0 52px;background:var(--tint,transparent);box-shadow:0 0 0 100vmax var(--tint,transparent);clip-path:inset(0 -100vmax);scroll-margin-top:calc(var(--jumpH,0px) + var(--bar))}
  .stack section.alt{--tint:var(--paper-2)}
  .layout ~ footer{margin-top:0}                      /* de laatste band loopt door tot de footer */
  .cat-head{margin-bottom:20px}
  .cat-head::before{content:"";display:block;width:40px;height:4px;background:var(--brass);margin-bottom:14px}
  .cat-head h2,.cat-head h3{display:block;margin:0;padding:0;border:0;font-family:'Bodoni Moda',serif;font-weight:700;font-size:clamp(34px,5vw,54px);line-height:1;letter-spacing:-.02em}
  /* De kolom loopt over de hele hoogte van de banden; de index erin blijft plakken. Hij begint op dezelfde hoogte als de eerste
     kop (padding-top) en blijft bij het scrollen dicht bij de bovenrand staan. z-index: boven de banden, die (met hun schaduw)
     anders over de index heen liggen. */
  .side{position:relative;z-index:5;padding-top:46px}
  .side nav{position:sticky;top:calc(var(--bar) + 24px);display:flex;flex-direction:column;gap:2px}
  .side a{display:block;padding:8px 12px;border-radius:9px;color:var(--ink);text-decoration:none;font-size:14px;font-weight:500;line-height:1.25;transition:background .15s,color .15s}
  .side a:hover{background:rgba(30,39,33,.08)}
  .side a[aria-current="true"]{background:var(--ink);color:var(--paper)}
  .side a:focus-visible{outline:3px solid var(--brass);outline-offset:2px}
  .side .gap{display:block;height:10px}
  @media (max-width:959px){
    .layout{display:block;padding:0}
    .side{display:none}
    .stack .wrap{max-width:1120px;padding:0 24px}
  }
  @media (min-width:960px){ .jumpbar{display:none} }

  /* de link onder de cocktails en mocktails naar de pagina met ze allemaal */
  .allmore{margin-top:22px;display:flex;flex-wrap:wrap;gap:8px}      /* Alle cocktails en Help me kiezen: een rij die op een smal scherm netjes doorloopt */
  .allmore .chip{font-size:14px;padding:9px 18px}
  ul.menu li.none{grid-column:1/-1;padding:14px 0;font-size:14px;color:rgba(30,39,33,.7);border:0}

  /* ---------- de categorie-chips zweven mee bij het scrollen ----------
     De balk staat los van de secties, zodat hij plakt over de hele pagina (dranken, mocktails en cocktails).
     --jumpH (de hoogte van de balk, gemeten door het script) houdt ankers en het staande label eronder. */
  .jumpbar{position:sticky;top:var(--bar);z-index:30;background:rgba(237,239,231,.94);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);padding:10px 0}
  .jumpbar .jump{margin:0;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
  .jumpbar .jump::-webkit-scrollbar{display:none}
  .jumpbar .chip{flex:none;white-space:nowrap}
  .jumpbar .chip[aria-current="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
</style>
</head>
<body>

<header class="shelf">
  <div class="wrap">
    <nav class="nav" aria-label="Pagina's">
      <a href="index.html" aria-current="page">Menu</a>
      <a href="wijnen.html">Wijnen</a>
      <a href="mocktails.html">Mocktails</a>
      <a href="cocktails.html">Cocktails</a>
      <a href="voorraad.html" hidden>Voorraad</a>
      <a href="admin.html" hidden>Beheer</a>
    </nav>
    <span class="eyebrow">Huisbar</span>
    <h1>Kelder<em>restjes</em></h1>
    <p class="lede">Open tot de laatste fles leeg is.</p>
    <div class="bottles" id="bar" aria-hidden="true"></div>
  </div>
</header>
<div class="brassbar" aria-hidden="true"></div>

<div class="jumpbar" id="jumpbar"><div class="wrap"><nav class="jump" id="jump" aria-label="Spring naar"></nav></div></div>

<div class="layout">
  <aside class="side" aria-label="Spring naar"><nav id="side"></nav></aside>
  <div class="stack">
    <div id="dranken"></div>

    <section class="alt" id="mocktails">
      <div class="wrap">
        <div class="cat-head"><h2>Mocktails</h2></div>
        <ul class="menu" id="mocktaillist"></ul>
        <p class="allmore"><a class="chip primary" id="allmocktails" href="mocktails.html">Alle mocktails →</a></p>
      </div>
    </section>

    <section id="cocktails">
      <div class="wrap">
        <div class="cat-head"><h2>Cocktails</h2></div>
        <ul class="menu" id="cocktaillist"></ul>
        <p class="allmore"><a class="chip primary" id="allcocktails" href="cocktails.html">Alle cocktails →</a></p>
      </div>
    </section>
  </div>
</div>

<footer class="site-footer"></footer>

<dialog id="recipedlg" aria-labelledby="rd-title">
  <div class="rd-body">
    <div class="rd-head"><h2 id="rd-title"></h2><span class="tag" id="rd-style"></span></div>
    <p class="blurb" id="rd-blurb"></p>
    <h3>Ingrediënten</h3>
    <ul class="spec" id="rd-spec"></ul>
    <p class="method" id="rd-method"></p>
    <div class="rd-btns">
      <a class="chip primary" id="rd-recipe" href="#" target="_blank" rel="noopener">Open recept ↗</a>
      <button type="button" class="chip" id="rd-close">Sluiten</button>
    </div>
  </div>
</dialog>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
<script src="js/supabase-config.js?v=81153845"></script>
<script src="js/supabase-client.js?v=81153845"></script>
<script src="js/admin.js?v=81153845"></script>
<script src="js/footer.js?v=81153845"></script>
<script src="js/session-badge.js?v=81153845"></script>
<script src="js/item-dialog.js?v=81153845"></script>
<script src="js/data-loader.js?v=81153845"></script>
<script src="js/boot.js?v=81153845"></script>
<script src="js/dialog-outside.js?v=81153845"></script>
<script src="js/suggest.js?v=81153845"></script>
<script src="js/drinks-dev.js?v=81153845"></script>
<script>
kelderBoot(['js/stock.js', async () => {
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const $ = id => document.getElementById(id);
/* alleen-ingrediënten staan niet als drank op het menu; een drank die ook ingrediënt is (cola) staat er gewoon, zonder recepten erbij */
const onMenu = n => SERVING[n] !== 'ingredient';
/* instelling show_out_of_stock (admin.html): bezoekers zien ook wat op is, doorgestreept */
const showOut = setting('show_out_of_stock') === true;
/* instellingen menu_show_cocktails en menu_show_mocktails: staat een lijst uit, dan is hij weg van het menu, ook bij de dranken */
const cocktailsOn = setting('menu_show_cocktails') !== false, mocktailsOn = setting('menu_show_mocktails') !== false;
/* de categorie met wijn heet "Wijn" (eerder "Wijn & bubbels"); beide werken */
const isWineLabel = l => l === 'Wijn' || l === 'Wijn & bubbels';
/* het alcoholpercentage (items.abv) staat bij bier en sterkere drank */
const abvTag = n => ABV[n] != null ? `<span class="tag">${String(ABV[n]).replace('.', ',')}%</span>` : '';
/* alleen een http(s)-link wordt een knop of link naar het recept */
const safeUrl = u => /^https?:\/\//i.test(u || '');
/* Het menu staat altijd op alfabet, ongeacht de volgorde in de database (sort_order): de dranken in elke groep, de cocktails en de
   mocktails, en de wijnsoorten. Hoofdletters en accenten tellen niet mee, getallen gaan op waarde. Alleen de volgorde van de groepen
   zelf (van alcoholvrij naar sterk) blijft zoals ze is. */
const az = (a, b) => String(a).localeCompare(String(b), 'nl', { sensitivity: 'base', numeric: true });
const byN = (a, b) => az(a.n, b.n);
const itemByName = new Map(kelderRows.items.map(i => [i.name, i]));
const recipeByKey = new Map();     // 'c:Naam' (cocktail) / 'm:Naam' (mocktail) → recept, voor het receptvenster

/* Beheerder: ben je ingelogd (op voorraad.html, in dit tabblad), dan opent een klik op een drank hetzelfde bewerkvenster als
   op de voorraadpagina (js/item-dialog.js). Wat op is blijft dan zichtbaar, gedimd, anders kun je het niet meer openen.
   Bezoekers merken hier niets van; wie mag schrijven bepaalt de database. */
let admin = false;
const visible = n => onMenu(n) && (admin || showOut || !isOut(n));
const outClass = n => (admin || showOut) && isOut(n) ? ' is-out' : '';
function nameOf(n){
  const it = admin && itemByName.get(n);
  return it ? `<button type="button" class="d-name item-edit" data-item="${it.id}">${esc(n)}</button>` : `<span class="d-name">${esc(n)}</span>`;
}

function render(){
  /* wat volgens de database op is, laten we niet zien (de beheerder wel, gedimd) */
  const RA = R.filter(canMix), ZA = Z.filter(canMix), PA = P.filter(isAvailable);
  /* op het menu staan alleen de cocktails en mocktails met een vinkje; de cocktail- en mocktailpagina tonen ze allemaal */
  const RM = RA.filter(r => r.menu).sort(byN), ZM = ZA.filter(r => r.menu).sort(byN);

  /* een cocktail of mocktail die opent in het receptvenster; zonder JavaScript of met ctrl/cmd-klik is het gewoon een link */
  function rlink(r, kind, cls){
    recipeByKey.set(kind + ':' + r.n, r);
    const page = kind === 'c' ? 'cocktails.html' : 'mocktails.html';
    return `<a class="${cls || 'rlink'}" href="${page}#${slug(r.n)}" data-recipe="${esc(kind + ':' + r.n)}">${esc(r.n)}</a>`;
  }

  function bottleRow(b){
    const mixes = (noMix(b) || !cocktailsOn) ? [] : RM.filter(r=>r.b.includes(b)), mocks = (noMix(b) || !mocktailsOn) ? [] : ZM.filter(r=>r.b.includes(b));      // uitgeschakeld voor cocktails: geen recepten erbij
    const solo = PA.find(p=>p.b.includes(b));
    return `<li class="drink${outClass(b)}">
    <div class="d-top">${nameOf(b)}${abvTag(b)}${solo && solo.t==='0%' ? '<span class="tag ready">0%</span>' : ''}</div>
    ${solo ? `<p class="d-sub">${esc(solo.blurb)}</p><p class="d-serve">${esc(solo.m)}</p>` : ''}
    ${mixes.length ? `<p class="d-mix">Cocktails: ${mixes.map(r=>rlink(r,'c')).join(' · ')}</p>` : ''}
    ${mocks.length ? `<p class="d-mix">Mocktails: ${mocks.map(r=>rlink(r,'m')).join(' · ')}</p>` : ''}
  </li>`;
  }
  function mixerRow(m){
    return `<li class="drink${outClass(m.n)}">
    <div class="d-top">${nameOf(m.n)}${abvTag(m.n)}${m.z ? '<span class="tag ready">0%</span>' : ''}</div>
    ${m.note ? `<p class="d-sub">${esc(m.note)}</p>` : ''}
  </li>`;
  }
  /* wijn staat op het menu altijd algemeen; de details staan op de wijnpagina */
  function wineRows(){
    return Object.keys(WKINDS).sort((a, b) => az(WKINDS[a], WKINDS[b])).map(k=>{
      const all = W.filter(w=>w.kind===k && (admin || showOut || !isOut(w.n)));
      if(!all.length) return '';
      return `<li class="drink">
      <div class="d-top"><a class="d-name" href="wijnen.html#${slug(k)}">${esc(WKINDS[k])}</a></div>
      <p class="d-sub">${all.length===1?'Eén soort':`${all.length} soorten`} in huis — bekijk de details op de wijnpagina.</p>
    </li>`;
    }).filter(Boolean);
  }
  function recipeRow(r, kind){
    return `<li class="drink">
    <div class="d-top">${rlink(r, kind, 'd-name')}<span class="tag">${esc(r.t)}</span></div>
    <p class="d-sub">${esc(r.s.map(x=>x[1]).join(' · '))}</p>
    ${safeUrl(r.u) ? `<a class="d-rec" href="${esc(r.u)}" target="_blank" rel="noopener">Recept online ↗</a>` : ''}
  </li>`;
  }
  /* elke categorie een eigen tint, van alcoholvrij naar sterk: salie, room, goud, rosé, koper */
  const TINTS = { 'Fris & mixers': '#DCE5D5', 'Koffie & melk': '#E9DFCF', 'Bier': '#EFE0B4', 'Wijn & bubbels': '#EBD5D2', 'Wijn': '#EBD5D2', 'Iets Sterker': '#E5CDB8' };
  const SPARE = ['#DCE5D5', '#E9DFCF', '#EFE0B4', '#EBD5D2', '#E5CDB8', '#D8E0E3'];
  let bands = 0;
  const group = (label, rows) => {
    const tint = TINTS[label] || SPARE[bands % SPARE.length];
    bands++;
    return `<section class="cat" id="${slug(label)}" style="--tint:${tint}"><div class="wrap"><div class="cat-head"><h3>${esc(label)}</h3></div><ul class="menu">${rows.join('')}</ul></div></section>`;
  };

  /* dranken: van alcoholvrij naar het sterkst; groepen zonder dranken vallen weg */
  $('dranken').innerHTML = ORDER.map(([label]) => {
    const rows = isWineLabel(label) ? wineRows()
      : G[label] ? G[label].filter(visible).sort(az).map(bottleRow)
      : M[label].filter(m=>visible(m.n)).sort(byN).map(mixerRow);
    return rows.length ? group(label, rows) : '';
  }).join('');
  $('mocktaillist').innerHTML = ZM.length ? ZM.map(r=>recipeRow(r,'m')).join('') : '<li class="none">Op dit moment staan er geen mocktails op het menu.</li>';
  $('cocktaillist').innerHTML = RM.length ? RM.map(r=>recipeRow(r,'c')).join('') : '<li class="none">Op dit moment staan er geen cocktails op het menu.</li>';
  /* instellingen menu_show_mocktails en menu_show_cocktails (admin.html): een lijst kan van het menu af */
  $('mocktails').hidden = !mocktailsOn;
  $('cocktails').hidden = !cocktailsOn;

  /* snel springen, in dezelfde volgorde als de pagina */
  const labels = [...ORDER.map(o=>o[0]), 'Mocktails', 'Cocktails'].filter(label => $(slug(label)) && !$(slug(label)).hidden);
  $('jump').innerHTML = labels.map(label => `<a class="chip" href="#${slug(label)}">${esc(label)}</a>`).join('');
  $('side').innerHTML = labels.map(label => (label === 'Mocktails' ? '<span class="gap"></span>' : '') + `<a href="#${slug(label)}">${esc(label)}</a>`).join('');
}

/* de hoogte van de zwevende balk, voor de ankers en het staande label (CSS-variabele --jumpH) */
function measureBar(){
  const bar = $('jumpbar');
  if(bar) document.documentElement.style.setProperty('--jumpH', bar.offsetHeight + 'px');
}
/* markeert in de balk de categorie die nu in beeld is (de laatste waarvan de bovenkant boven de balk is gekomen) */
function spy(){
  const links = [...document.querySelectorAll('#jump a')];
  if(!links.length) return;
  const line = ($('jumpbar') ? $('jumpbar').offsetHeight : 0) + 34;
  let current = links[0].getAttribute('href');
  for(const a of links){
    const target = document.querySelector(a.getAttribute('href'));
    if(target && target.getBoundingClientRect().top <= line) current = a.getAttribute('href');
  }
  document.querySelectorAll('#jump a, #side a').forEach(a => a.setAttribute('aria-current', String(a.getAttribute('href') === current)));
  const nav = $('jump'), chip = nav && nav.querySelector('a[aria-current="true"]');   // de actieve chip in beeld houden als de balk zijwaarts scrolt
  if(chip && nav.scrollWidth > nav.clientWidth){
    const l = chip.offsetLeft - nav.offsetLeft;
    if(l < nav.scrollLeft || l + chip.offsetWidth > nav.scrollLeft + nav.clientWidth) nav.scrollLeft = Math.max(0, l - 16);
  }
}

/* ---------- het receptvenster: ingrediënten, omschrijving en een knop naar het recept ---------- */
const rdlg = $('recipedlg');
function openRecipe(key){
  const r = recipeByKey.get(key);
  if(!r) return false;
  $('rd-title').textContent = r.n;
  $('rd-style').textContent = r.t || '';
  $('rd-style').hidden = !r.t;
  $('rd-blurb').textContent = r.blurb || '';
  $('rd-blurb').hidden = !r.blurb;
  $('rd-spec').innerHTML = r.s.map(x=>`<li><span class="ml">${esc(x[0])}</span><span>${esc(x[1])}</span></li>`).join('');
  $('rd-method').textContent = r.m || '';
  $('rd-method').hidden = !r.m;
  const rec = $('rd-recipe');
  rec.hidden = !safeUrl(r.u);
  if(safeUrl(r.u)) rec.href = r.u;
  rdlg.showModal();
  return true;
}
document.addEventListener('click', e => {
  const a = e.target.closest && e.target.closest('a[data-recipe]');
  if(!a || e.button !== 0 || e.ctrlKey || e.metaKey || e.shiftKey || e.altKey) return;    // ctrl/cmd-klik: gewoon de link
  if(openRecipe(a.dataset.recipe)) e.preventDefault();
});
$('rd-close').onclick = () => rdlg.close();
rdlg.addEventListener('click', e => { if(e.target === rdlg) rdlg.close(); });               // klik naast het venster sluit het

/* ---------- beheerder: een drank aanklikken opent het bewerkvenster van de voorraadpagina ---------- */
$('dranken').addEventListener('click', e => {
  const btn = e.target.closest('button.item-edit');
  if(!btn) return;
  const it = kelderRows.items.find(i => i.id === Number(btn.dataset.item));
  if(it) kelderItemDialog.open(it);
});

/* Is er een beheerderssessie in dit tabblad? Dan wachten we met de eerste weergave tot we het zeker weten, zodat het
   menu na een bewerking (de pagina laadt dan opnieuw) niet eerst als bezoeker flitst. Bezoekers wachten nergens op. */
let hint = false;
try{ hint = !!sessionStorage.getItem('kelderrestjes-admin-auth'); }catch(e){}
if(hint && window.kelderAdmin && kelderAdmin.available && window.kelderItemDialog){
  let ok = false;
  try{ ok = await kelderAdmin.current(); }catch(e){}
  if(ok){
    admin = true;
    kelderItemDialog.init({ categories: kelderRows.categories, items: kelderRows.items, wines: kelderRows.wines, onDone: () => location.reload() });
  }
}
render();
/* Help me kiezen (js/suggest.js): naast de knop Alle mocktails en naast Alle cocktails, in elke lijst die bezoekers zien; het zoekt in beide */
if(window.kelderSuggest){
  if(mocktailsOn) kelderSuggest.init({ host: $('mocktails').querySelector('.allmore') });
  if(cocktailsOn) kelderSuggest.init({ host: $('cocktails').querySelector('.allmore') });
}
measureBar();
spy();
addEventListener('resize', () => { measureBar(); spy(); });
let spyBusy = false;
addEventListener('scroll', () => { if(spyBusy) return; spyBusy = true; requestAnimationFrame(() => { spyBusy = false; spy(); }); }, { passive: true });
}]);
</script>
</body>
</html>
