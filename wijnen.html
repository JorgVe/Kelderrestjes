<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kelderrestjes — wijnen</title>
<meta name="description" content="De wijnen in huis, met druif, regio en alcoholpercentage.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,700;1,6..96,400&family=Karla:wght@400;500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --shelf:#7E9280;
    --shelf-deep:#5D6E60;
    --ink:#1E2721;
    --paper:#EDEFE7;
    --paper-2:#E2E6D9;
    --brass:#C69A3E;
    --amber:#B4622B;
    --line:rgba(30,39,33,.18);
    --bar:10px;                      /* alles wat bovenaan blijft staan bij het scrollen: de gele rand (10px) en, als die er is, de mededeling; zet boot.js */
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Karla',system-ui,sans-serif;
    font-size:16px;
    line-height:1.55;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:1120px;margin:0 auto;padding:0 24px}

  /* ---------- hero: the shelf ---------- */
  header.shelf{
    background:var(--shelf-deep);
    padding:56px 0 0;
    position:relative;
    overflow:hidden;
  }
  /* de gele rand onder de kop blijft bovenaan staan als je scrolt; de andere plakkende balken beginnen eronder (op --bar) */
  .brassbar{height:10px;background:var(--brass);position:sticky;top:0;z-index:40}
  .eyebrow{
    font-family:'Space Mono',monospace;
    font-size:11px;letter-spacing:.22em;text-transform:uppercase;
    color:rgba(255,255,255,.9);
  }
  h1{
    font-family:'Bodoni Moda',serif;
    font-weight:700;
    font-size:clamp(44px,9vw,104px);
    line-height:.92;
    letter-spacing:-.02em;
    color:#fff;
    margin:10px 0 14px;
  }
  h1 em{font-style:italic;font-weight:400;color:var(--brass)}
  .lede{
    max-width:54ch;color:rgba(255,255,255,.92);font-size:17px;
    padding-bottom:34px;
  }
  .lede .key{background:var(--paper);color:var(--amber);font-weight:700;padding:0 6px}
  .lede a{color:#fff}

  .nav{display:flex;gap:8px;margin-bottom:34px;position:relative;z-index:1}
  .nav a{
    font-family:'Space Mono',monospace;font-size:11px;letter-spacing:.18em;text-transform:uppercase;
    color:#fff;text-decoration:none;padding:7px 14px;
    border:1px solid rgba(255,255,255,.45);border-radius:999px;
  }
  .nav a:hover{border-color:#fff}
  .nav a[aria-current="page"]{background:#fff;color:var(--ink);border-color:#fff}
  .nav a:focus-visible{outline:3px solid var(--brass);outline-offset:2px}

  /* bottle silhouettes row — one per bottle on the shelf */
  .bottles{display:flex;align-items:flex-end;gap:5px;height:74px;position:relative;z-index:1;flex-wrap:nowrap;overflow:hidden}
  .bottles i{
    display:block;flex:1 1 0;max-width:16px;background:rgba(30,39,33,.22);
    border-radius:5px 5px 2px 2px;position:relative;
  }
  /* wijnflessen: smaller, met een langere hals, en per soort een tint */
  .bottles.wine i{max-width:14px}
  .bottles.wine i::before{width:4px;height:20px}
  .bottles.wine i.k-bub{background:rgba(201,162,75,.6)}
  .bottles.wine i.k-wit{background:rgba(255,255,255,.3)}
  .bottles.wine i.k-ros{background:rgba(226,140,150,.5)}
  .bottles.wine i.k-rood{background:rgba(96,20,36,.6)}
  .bottles i::before{
    content:"";position:absolute;left:50%;transform:translateX(-50%);
    bottom:100%;width:5px;height:12px;background:inherit;border-radius:2px;
  }

  /* ---------- picker ---------- */
  section{padding:56px 0}
  .sec-head{display:flex;align-items:baseline;gap:16px;flex-wrap:wrap;margin-bottom:8px}
  h2{
    font-family:'Bodoni Moda',serif;font-weight:700;
    font-size:clamp(26px,4vw,40px);letter-spacing:-.01em;
  }
  .sec-note{font-size:15px;color:rgba(30,39,33,.66);max-width:56ch;margin-bottom:26px}

  .group{margin-bottom:16px}
  .glabel{
    display:block;font-family:'Space Mono',monospace;font-size:10px;
    letter-spacing:.18em;text-transform:uppercase;color:rgba(30,39,33,.7);margin-bottom:7px;
  }
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{
    font-family:'Karla',sans-serif;font-size:14px;font-weight:500;
    background:transparent;color:var(--ink);
    border:1px solid var(--line);border-radius:999px;
    padding:7px 14px;cursor:pointer;
    transition:background .15s,color .15s,border-color .15s;
  }
  .chip:hover{border-color:var(--shelf-deep)}
  .chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
  .chip.reset{border-style:dashed;color:rgba(30,39,33,.7)}
  .chip:focus-visible{outline:3px solid var(--brass);outline-offset:2px}
  .count{
    font-family:'Space Mono',monospace;font-size:12px;letter-spacing:.1em;
    text-transform:uppercase;color:rgba(30,39,33,.7);margin-top:14px;display:block;
  }

  /* ---------- cards ---------- */
  /* haarlijnen via de randen van de kaarten (niet via de achtergrond van het raster): een rij die niet vol is, laat geen grijs vak achter */
  .grid{
    display:grid;gap:0;margin-top:22px;
    border-top:1px solid var(--line);border-left:1px solid var(--line);
    grid-template-columns:repeat(auto-fill,minmax(300px,1fr));
  }
  .card{background:var(--paper);padding:26px 24px 24px;display:flex;flex-direction:column;border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
  .card[hidden]{display:none}
  .card{scroll-margin-top:calc(var(--bar) + var(--jumpH,0px) + 16px)}      /* een kaart waar je naartoe springt, komt onder de gele rand en de chipbalk */
  .card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
  .card h3{
    font-family:'Bodoni Moda',serif;font-weight:700;font-size:25px;
    line-height:1.1;letter-spacing:-.01em;
  }
  .tags{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
  .tag{
    font-family:'Space Mono',monospace;font-size:10px;letter-spacing:.14em;
    text-transform:uppercase;padding:4px 7px;border:1px solid var(--line);
    white-space:nowrap;color:rgba(30,39,33,.7);
  }
  .tag.ready{border-color:var(--shelf-deep);background:var(--shelf-deep);color:#fff}
  .blurb{font-size:14px;color:rgba(30,39,33,.7);margin:8px 0 16px;font-style:italic}
  ul.spec{list-style:none;font-family:'Space Mono',monospace;font-size:13px;line-height:1.9}
  ul.spec li{display:flex;gap:10px;border-bottom:1px dotted var(--line);padding:1px 0}
  ul.spec li .ml{min-width:52px;color:rgba(30,39,33,.7)}
  .method{font-size:14px;margin-top:14px;color:rgba(30,39,33,.85)}
  .card a.rec{
    margin-top:auto;padding-top:16px;font-family:'Space Mono',monospace;
    font-size:11px;letter-spacing:.12em;text-transform:uppercase;
    color:var(--ink);text-underline-offset:4px;
  }
  .card a.rec:hover{color:var(--amber)}

  .empty{padding:40px 0;font-size:15px;color:rgba(30,39,33,.7)}
  .empty[hidden]{display:none}

  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
  @media (max-width:600px){ .bottles{gap:3px} }

  .nav{flex-wrap:wrap}
  section.alt{background:var(--paper-2)}
  a.chip{display:inline-block;text-decoration:none}
  a.chip:hover{background:var(--ink);color:var(--paper);border-color:var(--ink)}
  .jump{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px}

  /* ---------- menu & lijsten ---------- */
  .sect{margin-top:40px;scroll-margin-top:calc(16px + var(--bar) + var(--jumpH,0px))}
  .sect h3{
    font-family:'Bodoni Moda',serif;font-weight:700;font-size:24px;letter-spacing:-.01em;line-height:1.1;
    padding-bottom:6px;border-bottom:2px solid var(--ink);
    display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;
  }
  ul.menu{list-style:none;display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));column-gap:48px}
  .drink{padding:14px 0;border-bottom:1px dotted var(--line)}
  .d-top{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
  .d-name{font-weight:700;font-size:17px;color:var(--ink);text-decoration:none}
  a.d-name{text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:4px}
  a.d-name:hover{color:var(--amber);text-decoration-color:var(--amber)}
  a.d-name:focus-visible{outline:3px solid var(--brass);outline-offset:2px}
  .d-sub{font-size:14px;color:rgba(30,39,33,.7);font-style:italic;margin-top:2px}
  .d-serve{font-size:14px;color:rgba(30,39,33,.85);margin-top:2px}
  .d-mix{font-family:'Space Mono',monospace;font-size:11px;letter-spacing:.04em;line-height:1.7;color:rgba(30,39,33,.7);margin-top:6px}
  .d-rec{display:inline-block;margin-top:6px;font-family:'Space Mono',monospace;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink);text-underline-offset:4px}
  .d-rec:hover{color:var(--amber)}
  .gone-note{color:var(--amber)}

  /* ---------- niet beschikbaar ---------- */
  .tag.gone{border-color:var(--amber);color:var(--amber)}
  .tag[hidden]{display:none}
  .drink.is-out .d-name,.drink.is-out .d-sub,.drink.is-out .d-serve{opacity:.5}
  .drink.is-out .d-name{text-decoration:line-through}
  .card.out{opacity:.55}
  .card.out h3{text-decoration:line-through}
  .miss{font-family:'Space Mono',monospace;font-size:11px;letter-spacing:.06em;color:var(--amber);margin-top:10px}
  .miss[hidden]{display:none}

  /* ---------- wijnkaarten ---------- */
  dl.facts{font-family:'Space Mono',monospace;font-size:13px;line-height:1.9;margin-top:4px}
  dl.facts div{display:flex;gap:10px;border-bottom:1px dotted var(--line);padding:1px 0}
  dl.facts dt{min-width:72px;color:rgba(30,39,33,.7)}
  dl.facts dd.todo{color:rgba(30,39,33,.4);font-style:italic}
  .sect .grid{margin-top:16px}
  /* beheerder: de knoppen Bewerken en + Wijn toevoegen */
  .card .wine-edit{align-self:flex-start;margin-top:16px;font-size:12px;padding:4px 12px}
  .chip.primary{background:var(--ink);color:var(--paper);border-color:var(--ink)}
  .chip.primary:hover{background:var(--shelf-deep);border-color:var(--shelf-deep)}

  /* ---------- ingrediënten ---------- */
  .panel{background:#fff;border-left:3px solid var(--brass);padding:18px 20px;margin-top:22px}
  .panel h3{font-family:'Bodoni Moda',serif;font-size:20px;margin-bottom:8px}
  .pill{display:inline-block;margin:0 8px 8px 0;padding:5px 12px;border-radius:999px;background:var(--amber);color:#fff;font-size:14px;font-weight:500}
  .none{font-size:14px;color:rgba(30,39,33,.7)}
  .lostlist{list-style:none;font-size:14px}
  .lostlist li{padding:4px 0;border-bottom:1px dotted var(--line)}
  .lostlist span{color:rgba(30,39,33,.7)}
  pre#outcode{font-family:'Space Mono',monospace;font-size:12px;background:var(--paper-2);padding:10px 12px;margin:10px 0;overflow-x:auto;white-space:pre-wrap;word-break:break-word}
  .actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
  .actions .chip[hidden]{display:none}
  #state{font-size:14px;color:rgba(30,39,33,.75);max-width:62ch}

  /* ---------- de soorten links, zoals op het menu ----------
     Op een breed scherm staat links een index die meeschuift en markeert waar je bent; op een smal scherm doet de zwevende
     chipbalk bovenaan dat. --jumpH (de hoogte van die balk, gemeten door het script) houdt de ankers eronder. */
  .layout{max-width:1120px;margin:0 auto;padding:0 24px;display:grid;grid-template-columns:168px minmax(0,1fr);column-gap:36px}
  .stack{min-width:0}
  .stack .wrap{max-width:none;padding:0}
  .side{position:relative;z-index:5;padding-top:56px}
  .side nav{position:sticky;top:calc(var(--bar) + 24px);display:flex;flex-direction:column;gap:2px}
  .side a{display:block;padding:8px 12px;border-radius:9px;color:var(--ink);text-decoration:none;font-size:14px;font-weight:500;line-height:1.25;transition:background .15s,color .15s}
  .side a:hover{background:rgba(30,39,33,.08)}
  .side a[aria-current="true"]{background:var(--ink);color:var(--paper)}
  .side a:focus-visible{outline:3px solid var(--brass);outline-offset:2px}
  @media (max-width:959px){
    .layout{display:block;padding:0}
    .side{display:none}
    .stack .wrap{max-width:1120px;padding:0 24px}
  }
  @media (min-width:960px){ .jumpbar{display:none} }
  .jumpbar{position:sticky;top:var(--bar);z-index:30;background:rgba(237,239,231,.94);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);padding:10px 0}
  .jumpbar .jump{margin:0;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
  .jumpbar .jump::-webkit-scrollbar{display:none}
  .jumpbar .chip{flex:none;white-space:nowrap}
  .jumpbar .chip[aria-current="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
  .layout ~ footer{margin-top:0}
</style>
</head>
<body>

<header class="shelf">
  <div class="wrap">
    <nav class="nav" aria-label="Pagina's">
      <a href="index.html">Menu</a>
      <a href="wijnen.html" aria-current="page">Wijnen</a>
      <a href="mocktails.html">Mocktails</a>
      <a href="cocktails.html">Cocktails</a>
      <a href="voorraad.html" hidden>Voorraad</a>
      <a href="admin.html" hidden>Beheer</a>
    </nav>
    <span class="eyebrow">Kelderrestjes · wijnen</span>
    <h1>Wijnen</h1>
    <p class="lede">Druiven met een verhaal. Soms zelfs een waar.</p>
    <div class="bottles wine" id="bar" aria-hidden="true"></div>
  </div>
</header>
<div class="brassbar" aria-hidden="true"></div>

<div class="jumpbar" id="jumpbar"><div class="wrap"><nav class="jump" id="jump" aria-label="Spring naar"></nav></div></div>

<div class="layout">
  <aside class="side" aria-label="Spring naar"><nav id="side"></nav></aside>
  <div class="stack">
    <section>
      <div class="wrap">
        <div class="sec-head"><h2>Wat er open kan</h2></div>
        <p class="sec-note">Details per fles.</p>
        <div id="wines"></div>
      </div>
    </section>
  </div>
</div>

<footer class="site-footer"></footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
<script src="js/supabase-config.js?v=dbcf6cd2"></script>
<script src="js/supabase-client.js?v=dbcf6cd2"></script>
<script src="js/admin.js?v=dbcf6cd2"></script>
<script src="js/footer.js?v=dbcf6cd2"></script>
<script src="js/session-badge.js?v=dbcf6cd2"></script>
<script src="js/item-dialog.js?v=dbcf6cd2"></script>
<script src="js/data-loader.js?v=dbcf6cd2"></script>
<script src="js/boot.js?v=dbcf6cd2"></script>
<script>
kelderBoot(['js/stock.js', async () => {
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const fact = (label, v) => `<div><dt>${label}</dt><dd${v?'':' class="todo"'}>${v?esc(v):'nog invullen'}</dd></div>`;
/* Beheerder: ben je ingelogd (in dit tabblad), dan heeft elke wijn een knop Bewerken en kun je een wijn toevoegen, in hetzelfde
   bewerkvenster als op de voorraadpagina (js/item-dialog.js). Ook wat op is blijft dan zichtbaar, gedimd. Bezoekers merken hier
   niets van; wie mag schrijven bepaalt de database. */
let admin = false;
try{
  if(sessionStorage.getItem('kelderrestjes-admin-auth') && window.kelderAdmin && kelderAdmin.available && window.kelderItemDialog) admin = await kelderAdmin.current();
}catch(e){}
if(admin) kelderItemDialog.init({ categories: kelderRows.categories, items: kelderRows.items, wines: kelderRows.wines, onDone: () => location.reload() });

/* instelling show_out_of_stock (admin.html): bezoekers zien ook wat op is, doorgestreept */
const showOut = setting('show_out_of_stock') === true;

const wineCard = w => `
  <article class="card${(admin || showOut) && isOut(w.n) ? ' out' : ''}" id="${slug(w.n)}">
    <div class="card-top">
      <h3>${esc(w.n)}</h3>
      <div class="tags">
        <span class="tag">${esc(WKINDS[w.kind])}</span>
      </div>
    </div>
    <dl class="facts">
      ${fact('Druif', w.druif)}${fact('Regio', w.regio)}
    </dl>
    ${w.note?`<p class="method">${esc(w.note)}</p>`:''}
    ${admin ? `<button type="button" class="chip wine-edit" data-name="${esc(w.n)}">Bewerken</button>` : ''}
  </article>`;

/* wat volgens de database op is, laten we niet zien (de beheerder wel, gedimd) */
const WA = (admin || showOut) ? W : W.filter(w=>!isOut(w.n));
const kinds = Object.keys(WKINDS).filter(k=>WA.some(w=>w.kind===k));
document.getElementById('wines').innerHTML = kinds.map(k =>
  `<div class="sect" id="${slug(k)}"><h3>${esc(WKINDS[k])}</h3><div class="grid">${WA.filter(w=>w.kind===k).map(wineCard).join('')}</div></div>`
).join('');
document.getElementById('jump').innerHTML = kinds
  .map(k => `<a class="chip" href="#${slug(k)}">${esc(WKINDS[k])}</a>`).join('');
document.getElementById('side').innerHTML = kinds
  .map(k => `<a href="#${slug(k)}">${esc(WKINDS[k])}</a>`).join('');

/* de hoogte van de zwevende chipbalk (smal scherm), voor de ankers (--jumpH), en het markeren van de soort die in beeld is,
   in de index links en in de chipbalk (zoals op het menu) */
function measureBar(){
  const bar = document.getElementById('jumpbar');
  document.documentElement.style.setProperty('--jumpH', (bar && bar.offsetParent ? bar.offsetHeight : 0) + 'px');
}
function spy(){
  const links = [...document.querySelectorAll('#jump a')];
  if(!links.length) return;
  const bar = document.getElementById('jumpbar');
  const strip = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--bar')) || 10;
  const line = strip + (bar && bar.offsetParent ? bar.offsetHeight : 0) + 110;      // de soort wordt de huidige zodra zijn kop in het bovenste deel van het scherm staat
  let current = links[0].getAttribute('href');
  for(const a of links){
    const target = document.querySelector(a.getAttribute('href'));
    if(target && target.getBoundingClientRect().top <= line) current = a.getAttribute('href');
  }
  document.querySelectorAll('#jump a, #side a').forEach(a => a.setAttribute('aria-current', String(a.getAttribute('href') === current)));
}
measureBar();
spy();
addEventListener('resize', () => { measureBar(); spy(); });
let spyBusy = false;
addEventListener('scroll', () => { if(spyBusy) return; spyBusy = true; requestAnimationFrame(() => { spyBusy = false; spy(); }); }, { passive: true });

if(admin){
  const wineCat = kelderRows.categories.find(c => kelderItemDialog.isWineCat(c.id));
  const add = document.createElement('button');
  add.type = 'button'; add.className = 'chip primary'; add.id = 'addwine'; add.textContent = '+ Wijn toevoegen';
  add.onclick = () => kelderItemDialog.open(null, { category: wineCat ? wineCat.id : undefined });
  document.querySelector('.sec-head').appendChild(add);
  document.getElementById('wines').addEventListener('click', e => {
    const b = e.target.closest('button.wine-edit');
    const it = b && kelderRows.items.find(i => i.name === b.dataset.name);
    if(it) kelderItemDialog.open(it);
  });
}
}]);
</script>
</body>
</html>
