<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kelderrestjes — voorraad</title>
<meta name="description" content="Alle dranken en ingrediënten, met voorraad. Bron voor het menu, de cocktails en de mocktails.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,700;1,6..96,400&family=Karla:wght@400;500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --shelf:#7E9280;
    --shelf-deep:#5D6E60;
    --ink:#1E2721;
    --paper:#EDEFE7;
    --paper-2:#E2E6D9;
    --brass:#C69A3E;
    --amber:#B4622B;
    --line:rgba(30,39,33,.18);
    --bar:10px;                      /* alles wat bovenaan blijft staan bij het scrollen: de gele rand (10px) en, als die er is, de mededeling; zet boot.js */
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Karla',system-ui,sans-serif;
    font-size:16px;
    line-height:1.55;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:1120px;margin:0 auto;padding:0 24px}

  /* ---------- hero: the shelf ---------- */
  header.shelf{
    background:var(--shelf-deep);
    padding:56px 0 0;
    position:relative;
    overflow:hidden;
  }
  /* de gele rand onder de kop blijft bovenaan staan als je scrolt; de andere plakkende balken beginnen eronder (op --bar) */
  .brassbar{height:10px;background:var(--brass);position:sticky;top:0;z-index:40}
  .eyebrow{
    font-family:'Space Mono',monospace;
    font-size:11px;letter-spacing:.22em;text-transform:uppercase;
    color:rgba(255,255,255,.9);
  }
  h1{
    font-family:'Bodoni Moda',serif;
    font-weight:700;
    font-size:clamp(44px,9vw,104px);
    line-height:.92;
    letter-spacing:-.02em;
    color:#fff;
    margin:10px 0 14px;
  }
  h1 em{font-style:italic;font-weight:400;color:var(--brass)}
  .lede{
    max-width:54ch;color:rgba(255,255,255,.92);font-size:17px;
    padding-bottom:34px;
  }
  .lede .key{background:var(--paper);color:var(--amber);font-weight:700;padding:0 6px}
  .lede a{color:#fff}

  .nav{display:flex;gap:8px;margin-bottom:34px;position:relative;z-index:1}
  .nav a{
    font-family:'Space Mono',monospace;font-size:11px;letter-spacing:.18em;text-transform:uppercase;
    color:#fff;text-decoration:none;padding:7px 14px;
    border:1px solid rgba(255,255,255,.45);border-radius:999px;
  }
  .nav a:hover{border-color:#fff}
  .nav a[aria-current="page"]{background:#fff;color:var(--ink);border-color:#fff}
  .nav a:focus-visible{outline:3px solid var(--brass);outline-offset:2px}

  /* bottle silhouettes row — one per bottle on the shelf */
  .bottles{display:flex;align-items:flex-end;gap:5px;height:74px;position:relative;z-index:1;flex-wrap:nowrap;overflow:hidden}
  .bottles i{
    display:block;flex:1 1 0;max-width:16px;background:rgba(30,39,33,.22);
    border-radius:5px 5px 2px 2px;position:relative;
  }
  .bottles i::before{
    content:"";position:absolute;left:50%;transform:translateX(-50%);
    bottom:100%;width:5px;height:12px;background:inherit;border-radius:2px;
  }

  /* ---------- picker ---------- */
  section{padding:56px 0}
  .sec-head{display:flex;align-items:baseline;gap:16px;flex-wrap:wrap;margin-bottom:8px}
  h2{
    font-family:'Bodoni Moda',serif;font-weight:700;
    font-size:clamp(26px,4vw,40px);letter-spacing:-.01em;
  }
  .sec-note{font-size:15px;color:rgba(30,39,33,.66);max-width:56ch;margin-bottom:26px}

  .group{margin-bottom:16px}
  .glabel{
    display:block;font-family:'Space Mono',monospace;font-size:10px;
    letter-spacing:.18em;text-transform:uppercase;color:rgba(30,39,33,.7);margin-bottom:7px;
  }
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{
    font-family:'Karla',sans-serif;font-size:14px;font-weight:500;
    background:transparent;color:var(--ink);
    border:1px solid var(--line);border-radius:999px;
    padding:7px 14px;cursor:pointer;
    transition:background .15s,color .15s,border-color .15s;
  }
  .chip:hover{border-color:var(--shelf-deep)}
  .chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
  .chip.reset{border-style:dashed;color:rgba(30,39,33,.7)}
  .chip:focus-visible{outline:3px solid var(--brass);outline-offset:2px}
  .count{
    font-family:'Space Mono',monospace;font-size:12px;letter-spacing:.1em;
    text-transform:uppercase;color:rgba(30,39,33,.7);margin-top:14px;display:block;
  }

  /* ---------- cards ---------- */
  .grid{
    display:grid;gap:1px;background:var(--line);
    border:1px solid var(--line);margin-top:22px;
    grid-template-columns:repeat(auto-fill,minmax(300px,1fr));
  }
  .card{background:var(--paper);padding:26px 24px 24px;display:flex;flex-direction:column}
  .card[hidden]{display:none}
  .card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
  .card h3{
    font-family:'Bodoni Moda',serif;font-weight:700;font-size:25px;
    line-height:1.1;letter-spacing:-.01em;
  }
  .tags{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
  .tag{
    font-family:'Space Mono',monospace;font-size:10px;letter-spacing:.14em;
    text-transform:uppercase;padding:4px 7px;border:1px solid var(--line);
    white-space:nowrap;color:rgba(30,39,33,.7);
  }
  .tag.ready{border-color:var(--shelf-deep);background:var(--shelf-deep);color:#fff}
  .blurb{font-size:14px;color:rgba(30,39,33,.7);margin:8px 0 16px;font-style:italic}
  ul.spec{list-style:none;font-family:'Space Mono',monospace;font-size:13px;line-height:1.9}
  ul.spec li{display:flex;gap:10px;border-bottom:1px dotted var(--line);padding:1px 0}
  ul.spec li .ml{min-width:52px;color:rgba(30,39,33,.7)}
  .method{font-size:14px;margin-top:14px;color:rgba(30,39,33,.85)}
  .card a.rec{
    margin-top:auto;padding-top:16px;font-family:'Space Mono',monospace;
    font-size:11px;letter-spacing:.12em;text-transform:uppercase;
    color:var(--ink);text-underline-offset:4px;
  }
  .card a.rec:hover{color:var(--amber)}

  .empty{padding:40px 0;font-size:15px;color:rgba(30,39,33,.7)}
  .empty[hidden]{display:none}

  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
  @media (max-width:600px){ .bottles{gap:3px} }

  .nav{flex-wrap:wrap}
  section.alt{background:var(--paper-2)}
  a.chip{display:inline-block;text-decoration:none}
  a.chip:hover{background:var(--ink);color:var(--paper);border-color:var(--ink)}
  .jump{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px}

  /* ---------- menu & lijsten ---------- */
  .sect{margin-top:40px;scroll-margin-top:calc(16px + var(--bar))}
  .sect h3{
    font-family:'Bodoni Moda',serif;font-weight:700;font-size:24px;letter-spacing:-.01em;line-height:1.1;
    padding-bottom:6px;border-bottom:2px solid var(--ink);
    display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;
  }
  ul.menu{list-style:none;display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));column-gap:48px}
  .drink{padding:14px 0;border-bottom:1px dotted var(--line)}
  .d-top{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
  .d-name{font-weight:700;font-size:17px;color:var(--ink);text-decoration:none}
  a.d-name{text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:4px}
  a.d-name:hover{color:var(--amber);text-decoration-color:var(--amber)}
  a.d-name:focus-visible{outline:3px solid var(--brass);outline-offset:2px}
  .d-sub{font-size:14px;color:rgba(30,39,33,.7);font-style:italic;margin-top:2px}
  .d-serve{font-size:14px;color:rgba(30,39,33,.85);margin-top:2px}
  .d-mix{font-family:'Space Mono',monospace;font-size:11px;letter-spacing:.04em;line-height:1.7;color:rgba(30,39,33,.7);margin-top:6px}
  .d-rec{display:inline-block;margin-top:6px;font-family:'Space Mono',monospace;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink);text-underline-offset:4px}
  .d-rec:hover{color:var(--amber)}
  .gone-note{color:var(--amber)}

  /* ---------- niet beschikbaar ---------- */
  .tag.gone{border-color:var(--amber);color:var(--amber)}
  .tag[hidden]{display:none}
  .drink.is-out .d-name,.drink.is-out .d-sub,.drink.is-out .d-serve{opacity:.5}
  .drink.is-out .d-name{text-decoration:line-through}
  .card.out{opacity:.55}
  .card.out h3{text-decoration:line-through}
  .miss{font-family:'Space Mono',monospace;font-size:11px;letter-spacing:.06em;color:var(--amber);margin-top:10px}
  .miss[hidden]{display:none}

  /* ---------- wijnkaarten ---------- */
  dl.facts{font-family:'Space Mono',monospace;font-size:13px;line-height:1.9;margin-top:4px}
  dl.facts div{display:flex;gap:10px;border-bottom:1px dotted var(--line);padding:1px 0}
  dl.facts dt{min-width:72px;color:rgba(30,39,33,.7)}
  dl.facts dd.todo{color:rgba(30,39,33,.4);font-style:italic}
  .sect .grid{margin-top:16px}

  /* ---------- ingrediënten ---------- */
  .panel{background:#fff;border-left:3px solid var(--brass);padding:18px 20px;margin-top:22px}
  .panel h3{font-family:'Bodoni Moda',serif;font-size:20px;margin-bottom:8px}
  .pill{display:inline-block;margin:0 8px 8px 0;padding:5px 12px;border-radius:999px;background:var(--amber);color:#fff;font-size:14px;font-weight:500}
  .none{font-size:14px;color:rgba(30,39,33,.7)}
  .lostlist{list-style:none;font-size:14px}
  .lostlist li{padding:4px 0;border-bottom:1px dotted var(--line)}
  .lostlist span{color:rgba(30,39,33,.7)}
  .panel input{font:inherit;font-size:14px;padding:6px 12px;border:1px solid var(--line);border-radius:999px;background:var(--paper);color:var(--ink);min-width:0;flex:1 1 180px}
  .panel input:focus-visible{outline:3px solid var(--brass);outline-offset:2px}
  .actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
  .actions[hidden]{display:none}
  .actions .chip[hidden]{display:none}

  /* ---------- voorraad beheren (beheerder) ---------- */
  #stockmsg{font-size:14px;min-height:1.55em;margin-top:10px}
  #stockmsg.bad{color:var(--amber);font-weight:700}
  .chip:disabled{opacity:.5;cursor:progress}
  .chip.primary{background:var(--ink);color:var(--paper);border-color:var(--ink)}
  .chip.primary:hover{background:var(--shelf-deep);border-color:var(--shelf-deep)}
  .chip.danger{border-color:var(--amber);color:var(--amber)}

  .tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:28px;padding:14px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--paper)}
  .tools input[type=search],.tools select{font:inherit;font-size:14px;padding:7px 14px;border:1px solid var(--line);border-radius:999px;background:#fff;color:var(--ink);min-width:0}
  .tools input[type=search]{flex:1 1 130px}
  .tools input:focus-visible,.tools select:focus-visible{outline:3px solid var(--brass);outline-offset:2px}
  .tools .chips{display:flex;flex-wrap:wrap;gap:6px}
  .tools .spacer{flex:1 1 auto}
  @media (min-width:760px){ .tools{position:sticky;top:var(--bar);z-index:5} }

  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

  /* ---------- de lijst ---------- */
  .stocktable{width:100%;border-collapse:collapse;margin-top:8px;font-size:15px}
  .stocktable th,.stocktable td{text-align:left;vertical-align:top;padding:10px 12px;border-bottom:1px dotted var(--line)}
  .stocktable thead th{font-family:'Space Mono',monospace;font-size:10px;font-weight:400;letter-spacing:.14em;text-transform:uppercase;color:rgba(30,39,33,.7);border-bottom:2px solid var(--ink);padding-top:20px;white-space:nowrap}
  /* de kolomkoppen blijven onder de (ook zwevende) werkbalk staan; --toolsH en --theadH worden door js/voorraad.js gemeten.
     De onderlijn is een schaduw: bij samengevoegde randen blijft een echte rand niet mee plakken. Alleen bij de tabel (niet de kaartjes). */
  @media (min-width:821px){
    .stocktable thead th{position:sticky;top:calc(var(--bar) + var(--toolsH,64px));z-index:4;background:var(--paper);border-bottom:0;box-shadow:inset 0 -2px 0 var(--ink)}
  }
  .stocktable .c-status{width:156px}
  .stocktable .c-name{width:46%}
  .stocktable .c-kind{width:74px;text-align:center}
  .stocktable thead th.c-kind{text-align:center}
  .stocktable .menu-check{width:18px;height:18px;margin:2px 0 0;accent-color:var(--ink);cursor:pointer}
  .stocktable .menu-check:disabled{opacity:.5;cursor:progress}
  .stocktable .menu-check:focus-visible{outline:3px solid var(--brass);outline-offset:2px}
  .stocktable .c-qty{width:104px}
  .stocktable .qty{width:78px;font:inherit;font-size:15px;padding:5px 8px;border:1px solid rgba(30,39,33,.35);border-radius:8px;background:#fff;color:var(--ink)}
  .stocktable .qty::placeholder{color:rgba(30,39,33,.5)}
  .stocktable .qty:focus-visible{outline:3px solid var(--brass);outline-offset:2px}
  .stocktable .qty:disabled{opacity:.5;cursor:progress}
  .stocktable .c-act{width:100px;text-align:right}
  .stocktable td.c-act .chip{font-size:12px;padding:4px 12px}
  .stocktable tr.cat-row th{padding:30px 12px 8px 0;border-bottom:2px solid var(--ink);font-weight:400}
  .cat-head{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
  .cat-name{font-family:'Bodoni Moda',serif;font-weight:700;font-size:30px;letter-spacing:-.01em;line-height:1.1;color:var(--ink)}
  .cat-head .cnt{font-family:'Space Mono',monospace;font-size:11px;letter-spacing:.04em;color:rgba(30,39,33,.7)}
  .stocktable tr.drink:hover td{background:rgba(255,255,255,.55)}
  .stocktable .d-name{font-weight:700;font-size:16px;color:var(--ink)}
  .stocktable .tags{display:inline-flex;gap:4px;flex-wrap:wrap;margin-left:8px;vertical-align:1px}
  .stocktable tr.is-out .d-name{text-decoration:line-through;opacity:.55}
  /* is er een sessie in dit tabblad, dan tonen we "Laden…" tot de pagina weet of je nog ingelogd bent (zie het scriptje in de head
     en show() in js/voorraad.js); zonder sessie opent het inlogvenster van het blokje rechtsboven meteen */
  #authwait{display:none}
  .maybe-admin #authwait{display:block}
  .stocktable .na{color:rgba(30,39,33,.3)}


  /* ---------- fles scannen ---------- */
  dialog#scandlg{margin:auto;border:0;border-top:6px solid var(--brass);padding:0;width:min(520px,calc(100vw - 24px));max-height:calc(100vh - 24px);background:var(--paper);color:var(--ink);box-shadow:0 20px 60px rgba(0,0,0,.35)}
  dialog#scandlg::backdrop{background:rgba(30,39,33,.6)}
  .sc-body{padding:20px 22px;display:grid;gap:12px}
  .sc-body h2{font-size:26px}
  #sc-live,#sc-found,#sc-unknown{display:grid;gap:10px}
  #sc-live[hidden],#sc-found[hidden],#sc-unknown[hidden]{display:none}
  .sc-view{position:relative;background:#111;border-radius:10px;overflow:hidden;aspect-ratio:4/3}
  .sc-view[hidden]{display:none}
  .sc-view video{width:100%;height:100%;object-fit:cover;display:block}
  .sc-frame{position:absolute;inset:26% 9%;border:3px solid rgba(255,255,255,.9);border-radius:10px;box-shadow:0 0 0 999px rgba(0,0,0,.28)}
  #sc-status{font-size:14px;min-height:1.4em}
  #sc-status.bad{color:var(--amber);font-weight:700}
  .sc-manual{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end}
  .sc-manual label,.sc-search{display:grid;gap:4px;font-size:14px;font-weight:700;flex:1 1 200px}
  .sc-manual input,#sc-q{font:inherit;font-size:15px;font-weight:400;padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);width:100%;min-width:0}
  .sc-manual input:focus-visible,#sc-q:focus-visible{outline:3px solid var(--brass);outline-offset:2px}
  .sc-btns{display:flex;flex-wrap:wrap;gap:8px}
  .sc-code{font-family:'Space Mono',monospace;font-size:12px;letter-spacing:.06em;color:rgba(30,39,33,.7)}
  #sc-found h3{font-family:'Bodoni Moda',serif;font-weight:700;font-size:30px;line-height:1.05}
  #sc-found .status.big{align-self:start;justify-self:start}
  #sc-msg,#sc-unknown-msg{min-height:1.4em;font-size:14px}
  #sc-msg.bad,#sc-unknown-msg.bad{color:var(--amber);font-weight:700}
  .sc-list{list-style:none;display:grid;gap:6px;max-height:min(260px,36vh);overflow:auto}
  .sc-list button{width:100%;text-align:left;font:inherit;font-size:15px;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);cursor:pointer;display:flex;justify-content:space-between;gap:10px}
  .sc-list button:hover{border-color:var(--shelf-deep)}
  .sc-list button:focus-visible{outline:3px solid var(--brass);outline-offset:2px}
  .sc-list .meta{color:rgba(30,39,33,.7);font-size:13px;white-space:nowrap}

  /* de schakelaar Op voorraad / Op: een echte schakelaar (baan met knop), met de stand ernaast. Aan = groene baan, knop rechts. */
  .status{position:relative;display:inline-flex;align-items:center;gap:10px;font:700 13px/1.2 'Karla',sans-serif;padding:4px 0;border:0;background:none;color:var(--ink);cursor:pointer;white-space:nowrap}
  .status::before{content:"";flex:none;width:44px;height:26px;border-radius:999px;background:var(--shelf-deep);box-shadow:inset 0 0 0 1px rgba(30,39,33,.25);transition:background .15s}
  .status::after{content:"";position:absolute;left:3px;top:50%;width:20px;height:20px;margin-top:-10px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.35);transform:translateX(18px);transition:transform .15s}
  .status[aria-checked="false"]{color:var(--amber)}
  .status[aria-checked="false"]::before{background:#777B75}
  .status[aria-checked="false"]::after{transform:none}
  .status:hover::before{filter:brightness(.92)}
  .status:focus-visible{outline:3px solid var(--brass);outline-offset:3px;border-radius:999px}
  .status:disabled{opacity:.5;cursor:progress}
  .status.big{font-size:16px;gap:12px}
  .status.big::before{width:56px;height:32px}
  .status.big::after{left:4px;width:24px;height:24px;margin-top:-12px;transform:translateX(24px)}
  .status.big[aria-checked="false"]::after{transform:none}
  @media (prefers-reduced-motion:reduce){ .status::before,.status::after{transition:none} }

  /* smal scherm: elke rij wordt een kaartje met de kolomnamen erbij */
  @media (max-width:820px){
    .stocktable,.stocktable tbody,.stocktable tr,.stocktable td,.stocktable th{display:block;width:auto}
    .stocktable thead{display:none}
    .stocktable tr.cat-row th{padding:26px 0 8px}
    .stocktable tr.drink{padding:12px 0;border-bottom:1px dotted var(--line)}
    .stocktable td{border:0;padding:3px 0}
    .stocktable td[class]{width:auto}
    .stocktable td.c-qty,.stocktable td.c-kind{display:flex;gap:10px;align-items:center}
    .stocktable td[data-label]::before{content:attr(data-label);min-width:92px;font-family:'Space Mono',monospace;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:rgba(30,39,33,.7);padding-top:3px}
    .stocktable td.c-status::before,.stocktable td.c-name::before,.stocktable td.c-act::before{display:none}
    .stocktable td.na-cell{display:none}
    .stocktable td.c-act{text-align:left;padding-top:8px}
    .stocktable tr.drink:hover td{background:none}
  }
</style>
<script>
/* Is er een beheerderssessie in dit tabblad (zie js/admin.js: dezelfde sleutel)? Dan eerst "Laden…" tonen. Als het laden mislukt,
   valt dit na 8 seconden terug op de pagina zonder dat. */
try{
  if(sessionStorage.getItem('kelderrestjes-admin-auth')){
    document.documentElement.classList.add('maybe-admin');
    setTimeout(function(){ document.documentElement.classList.remove('maybe-admin'); }, 8000);
  }
}catch(e){}
</script>
</head>
<body>

<header class="shelf">
  <div class="wrap">
    <nav class="nav" aria-label="Pagina's">
      <a href="index.html">Menu</a>
      <a href="wijnen.html">Wijnen</a>
      <a href="mocktails.html">Mocktails</a>
      <a href="cocktails.html">Cocktails</a>
      <a href="voorraad.html" aria-current="page" hidden>Voorraad</a>
      <a href="admin.html" hidden>Beheer</a>
    </nav>
    <span class="eyebrow">Kelderrestjes · voorraad</span>
    <h1>Voorraad</h1>
    <p class="lede">Hier tellen we wat er nog is. Meestal minder dan gedacht.</p>
    
  </div>
</header>
<div class="brassbar" aria-hidden="true"></div>

<section>
  <div class="wrap">
    <p class="none" id="authwait" role="status">Laden…</p>

    <div id="private" hidden>
      <div class="sec-head"><h2>Voorraad beheren</h2></div>
      <p id="stockmsg" role="status" aria-live="polite"></p>


      <div class="tools">
        <input type="search" id="q" placeholder="Zoek een drank of ingrediënt" aria-label="Zoeken" autocomplete="off">
        <div class="chips" role="group" aria-label="Filter op voorraad">
          <button type="button" class="chip" data-status="all" aria-pressed="true">Alles</button>
          <button type="button" class="chip" data-status="in" aria-pressed="false">Op voorraad</button>
          <button type="button" class="chip" data-status="out" aria-pressed="false">Op</button>
        </div>
        <select id="catfilter" aria-label="Categorie"></select>
        <span class="spacer"></span>
        <button type="button" class="chip primary" id="scan">Scan fles</button>
        <button type="button" class="chip primary" id="additem">+ Toevoegen</button>
      </div>

      <div id="lists"></div>

      <dialog id="scandlg" aria-labelledby="sc-title">
        <div class="sc-body">
          <h2 id="sc-title">Fles scannen</h2>

          <div id="sc-live">
            <div class="sc-view" id="sc-view"><video id="sc-video" playsinline muted></video><div class="sc-frame" aria-hidden="true"></div></div>
            <p id="sc-status" role="status">Camera starten…</p>
            <form class="sc-manual" id="sc-manual">
              <label>Of typ de barcode
                <input type="text" id="sc-code" inputmode="numeric" autocomplete="off" maxlength="64" placeholder="bijv. 5410316...">
              </label>
              <button type="submit" class="chip">Zoek</button>
            </form>
          </div>

          <div id="sc-found" hidden>
            <p class="sc-code">Barcode <span id="sc-found-code"></span></p>
            <h3 id="sc-found-name"></h3>
            <p class="none" id="sc-found-meta"></p>
            <button type="button" class="status big" id="sc-toggle" role="switch"></button>
            <p id="sc-msg" role="status" aria-live="polite"></p>
            <div class="sc-btns">
              <button type="button" class="chip primary" id="sc-edit">Bewerken</button>
              <button type="button" class="chip" id="sc-next">Scan volgende</button>
            </div>
          </div>

          <div id="sc-unknown" hidden>
            <p>Deze barcode <b id="sc-unknown-code"></b> hoort nog bij geen enkele drank.</p>
            <label class="sc-search">Koppel hem aan een bestaande drank
              <input type="search" id="sc-q" placeholder="Zoek op naam" autocomplete="off">
            </label>
            <ul class="sc-list" id="sc-list"></ul>
            <p id="sc-unknown-msg" role="status" aria-live="polite"></p>
            <div class="sc-btns">
              <button type="button" class="chip primary" id="sc-new">Nieuwe drank met deze barcode</button>
              <button type="button" class="chip" id="sc-retry">Opnieuw scannen</button>
            </div>
          </div>

          <div class="sc-btns"><button type="button" class="chip" id="sc-close">Sluiten</button></div>
        </div>
      </dialog>
    </div>
  </div>
</section>

<footer class="site-footer"></footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
<script src="js/supabase-config.js?v=abc58265"></script>
<script src="js/supabase-client.js?v=abc58265"></script>
<script src="js/admin.js?v=abc58265"></script>
<script src="js/footer.js?v=abc58265"></script>
<script src="js/session-badge.js?v=abc58265"></script>
<script src="js/item-dialog.js?v=abc58265"></script>
<script src="js/scanner.js?v=abc58265"></script>
<script src="js/dialog-outside.js?v=abc58265"></script>
<script src="js/photo-scan.js?v=abc58265"></script>
<script src="js/scan-dev.js?v=abc58265"></script>
<script src="js/data-loader.js?v=abc58265"></script>
<script src="js/boot.js?v=abc58265"></script>
<script>kelderBoot(['js/stock.js', 'js/voorraad.js']);</script>
</body>
</html>
