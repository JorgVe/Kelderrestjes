# Minimale Supabase CLI-config voor Kelderrestjes.
# Voor lokaal draaien (`supabase start`) en `supabase db push` / `supabase config push`.
# Ontbreekt er iets, draai dan `supabase init` in een lege map en neem de rest over.

project_id = "kelderrestjes"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[db.migrations]
enabled = true

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[studio]
enabled = true
port = 54323

[auth]
enabled = true
# pas aan naar waar de website draait
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = ["http://localhost:3000"]
jwt_expiry = 3600
# De site is publiek: geen vrije registratie. Beheerders maak je aan in het dashboard
# (Authentication > Users) en zet je daarna in de tabel `admins`.
enable_signup = false

[auth.email]
enable_signup = false
enable_confirmations = false

# Edge Function die een foto van flessen leest en een concept teruggeeft (schrijft niets). Uitrollen: supabase functions deploy analyze-bottles
[functions.analyze-bottles]
verify_jwt = true

# Edge Function die uit de wijnen op voorraad de beste kiest bij het menu van vandaag (alleen voor beheerders, schrijft niets). Uitrollen: supabase functions deploy pair-wine
[functions.pair-wine]
verify_jwt = true

# Edge Function met twee hulpjes voor de cocktail- en mocktailpagina (schrijft niets): "Help me kiezen" voor iedereen (met een limiet per
# bezoeker en per dag, zie migratie 0028) en nieuwe recepten laten bedenken voor beheerders. Bezoekers hebben geen sessie, dus de controle van
# de sessie staat uit; de functie controleert zelf of iemand beheerder is. Uitrollen: supabase functions deploy cocktail-ai --no-verify-jwt
[functions.cocktail-ai]
verify_jwt = false
